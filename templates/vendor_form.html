{% extends "base.html" %}

{% block content %}
<div class="row mb-4">
    <div class="col-12">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{{ url_for('index') }}">Dashboard</a></li>
                <li class="breadcrumb-item"><a href="{{ url_for('vendors_list') }}">Vendors</a></li>
                <li class="breadcrumb-item active">{{ 'Edit Vendor' if vendor else 'Add Vendor' }}</li>
            </ol>
        </nav>
        <h2 class="fw-bold">
            <i class="bi bi-{{ 'pencil' if vendor else 'plus-circle' }} me-2 text-primary"></i>
            {{ 'Edit Vendor' if vendor else 'Add New Vendor' }}
        </h2>
    </div>
</div>

<div class="row">
    <div class="col-lg-8 mx-auto">
        <div class="card">
            <div class="card-header">
                <i class="bi bi-shop me-2"></i>Vendor Details
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('edit_vendor', vendor_id=vendor.id) if vendor else url_for('add_vendor') }}">
                    
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Vendor Name <span class="text-danger">*</span></label>
                            <input type="text" name="name" class="form-control" required 
                                   value="{{ vendor.name if vendor else '' }}" placeholder="e.g. Dell Technologies">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Contact Person</label>
                            <input type="text" name="contact_person" class="form-control" 
                                   value="{{ vendor.contact_person if vendor else '' }}" placeholder="e.g. Rajesh Kumar">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Phone</label>
                            <input type="text" name="phone" class="form-control" 
                                   value="{{ vendor.phone if vendor else '' }}" placeholder="e.g. 9876543210">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Email</label>
                            <input type="email" name="email" class="form-control" 
                                   value="{{ vendor.email if vendor else '' }}" placeholder="e.g. vendor@company.com">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">GST Number</label>
                            <input type="text" name="gst_number" class="form-control" 
                                   value="{{ vendor.gst_number if vendor else '' }}" placeholder="e.g. 27AABCD1234E1Z5">
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-bold">Address</label>
                            <textarea name="address" class="form-control" rows="3" placeholder="Full address...">{{ vendor.address if vendor else '' }}</textarea>
                        </div>
                    </div>

                    <div class="d-flex gap-2 justify-content-end mt-4">
                        <a href="{{ url_for('vendors_list') }}" class="btn btn-outline-secondary">
                            <i class="bi bi-x-circle me-1"></i>Cancel
                        </a>
                        <button type="submit" class="btn btn-marvel">
                            <i class="bi bi-check-lg me-1"></i>{{ 'Update Vendor' if vendor else 'Create Vendor' }}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
