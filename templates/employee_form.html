{% extends "base.html" %}

{% block content %}
<div class="row mb-4">
    <div class="col-12">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{{ url_for('index') }}">Dashboard</a></li>
                <li class="breadcrumb-item"><a href="{{ url_for('employees_list') }}">Employees</a></li>
                <li class="breadcrumb-item active">{{ 'Edit Employee' if employee else 'Add Employee' }}</li>
            </ol>
        </nav>
        <h2 class="fw-bold">
            <i class="bi bi-{{ 'pencil' if employee else 'plus-circle' }} me-2 text-primary"></i>
            {{ 'Edit Employee' if employee else 'Add New Employee' }}
        </h2>
    </div>
</div>

<div class="row">
    <div class="col-lg-10 mx-auto">
        <div class="card">
            <div class="card-header">
                <i class="bi bi-person me-2"></i>Employee Details
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('edit_employee', employee_id=employee.id) if employee else url_for('add_employee') }}" id="employeeForm">
                    
                    <!-- Basic Information -->
                    <h5 class="fw-bold text-primary mb-3"><i class="bi bi-info-circle me-2"></i>Basic Information</h5>
                    <div class="row g-3 mb-4">
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Employee Code</label>
                            <input type="text" class="form-control" disabled 
                                   value="{{ employee.employee_code if employee else 'Auto-generated' }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Full Name <span class="text-danger">*</span></label>
                            <input type="text" name="name" class="form-control" required 
                                   value="{{ employee.name if employee else '' }}" placeholder="e.g. John Doe">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Email</label>
                            <input type="email" name="email" class="form-control" 
                                   value="{{ employee.email if employee else '' }}" placeholder="e.g. john@marveltech.com">
                        </div>
                        <div class="col-md-4">
    <label class="form-label fw-bold">Phone</label>
    <input type="text" name="phone" class="form-control" 
           value="{{ employee.phone if employee else '' }}" placeholder="e.g. 9876543210">
</div>
<div class="col-md-4">
    <label class="form-label fw-bold">
        Employee Portal Password
        {% if not employee %}
        <span class="text-danger">*</span>
        {% endif %}
    </label>
    <input
        type="password"
        name="password"
        class="form-control"
        {% if not employee %}required{% endif %}
        placeholder="{{ 'Leave blank to keep current password' if employee else 'Set temporary password' }}">
</div>
<div class="col-md-4">
    <label class="form-label fw-bold">Status</label>
                            <select name="status" class="form-select">
                                <option value="Active" {{ 'selected' if employee and employee.status == 'Active' else '' }}>Active</option>
                                <option value="Inactive" {{ 'selected' if employee and employee.status == 'Inactive' else '' }}>Inactive</option>
                            </select>
                        </div>
                    </div>

                    <!-- Work Information -->
                    <h5 class="fw-bold text-primary mb-3"><i class="bi bi-briefcase me-2"></i>Work Information</h5>
                    <div class="row g-3 mb-4">
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Department</label>
                            <input type="text" name="department" class="form-control" 
                                   value="{{ employee.department if employee else '' }}" placeholder="e.g. IT, HR, Finance">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Designation</label>
                            <input type="text" name="designation" class="form-control" 
                                   value="{{ employee.designation if employee else '' }}" placeholder="e.g. Software Engineer">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Business Unit <span class="text-danger">*</span></label>
                            <select name="business_unit_id" class="form-select" required>
                                <option value="">Select Business Unit...</option>
                                {% for unit in business_units %}
                                <option value="{{ unit.id }}"
                                {% if employee and employee.business_unit_id == unit.id %}selected{% endif %}
        >
        {{ unit.country_flag or '' }} {{ unit.name }} — {{ unit.currency or '' }} {{ unit.currency_symbol or '' }}
    </option>
    {% endfor %}
</select>
</div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Team</label>
                            <input type="text" name="team" class="form-control" 
                                   value="{{ employee.team if employee else '' }}" placeholder="e.g. Development">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Client</label>
                            <input type="text" name="client" class="form-control" 
                                   value="{{ employee.client if employee else '' }}" placeholder="e.g. Internal / Client Name">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Location</label>
                            <input type="text" name="location" class="form-control" 
                                   value="{{ employee.location if employee else '' }}" placeholder="e.g. Bangalore, Mumbai">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Date of Joining</label>
                            <input type="date" name="date_of_joining" class="form-control" 
                                   value="{{ employee.date_of_joining if employee else '' }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Work Mode</label>
                            <select name="work_mode" class="form-select">
                                <option value="Remote" {{ 'selected' if employee and employee.work_mode == 'Remote' else '' }}>Remote</option>
                                <option value="Onsite" {{ 'selected' if employee and employee.work_mode == 'Onsite' else '' }}>Onsite</option>
                                <option value="Hybrid" {{ 'selected' if employee and employee.work_mode == 'Hybrid' else '' }}>Hybrid</option>
                            </select>
                        </div>
                    </div>

                    <div class="d-flex gap-2 justify-content-end">
                        <a href="{{ url_for('employees_list') }}" class="btn btn-outline-secondary">
                            <i class="bi bi-x-circle me-1"></i>Cancel
                        </a>
                        <button type="submit" class="btn btn-marvel">
                            <i class="bi bi-check-lg me-1"></i>{{ 'Update Employee' if employee else 'Create Employee' }}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
